<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مستشارك — University Q&A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2A4A;
    --cream: #F7F3EC;
    --gold: #B08D57;
    --charcoal: #2B2B2B;
    --sage: #7A8B6F;
    --line: #E2DACB;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'Inter', 'Noto Sans Arabic', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 22px 28px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
  }

  .brand {
    font-family: 'Noto Sans Arabic', 'Lora', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--ink);
    letter-spacing: 0.2px;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--charcoal);
    opacity: 0.7;
  }

  .status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sage);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px 12px;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
  }

  .intro {
    padding: 18px 0 28px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }

  .intro h1 {
    font-family: 'Noto Sans Arabic', 'Lora', serif;
    font-weight: 500;
    font-size: 24px;
    line-height: 1.6;
    margin: 0 0 10px;
    color: var(--ink);
    max-width: 480px;
    margin-right: 0;
    margin-left: auto;
    text-align: right;
  }

  .intro p {
    font-family: 'Noto Sans Arabic', 'Inter', sans-serif;
    font-size: 14.5px;
    line-height: 1.8;
    color: var(--charcoal);
    opacity: 0.75;
    max-width: 460px;
    margin: 0 0 0 auto;
    text-align: right;
  }

  .message {
    margin-bottom: 20px;
    line-height: 1.6;
    font-size: 15px;
    max-width: 90%;
  }

  .message.user {
    margin-left: auto;
    background: var(--ink);
    color: var(--cream);
    padding: 12px 16px;
    border-radius: 14px 14px 2px 14px;
  }

  .message.assistant {
    margin-right: auto;
    padding: 2px 0 0 0;
  }

  .message.assistant .label {
    font-size: 12px;
    text-transform: none;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
  }

  .sources {
    margin-top: 10px;
  }

  .sources summary {
    cursor: pointer;
    font-size: 12.5px;
    color: var(--charcoal);
    opacity: 0.6;
  }

  .sources summary:hover { opacity: 0.9; }

  .sources .chunk {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    white-space: pre-wrap;
    color: var(--charcoal);
    opacity: 0.85;
  }

  .thinking {
    display: flex;
    gap: 4px;
    padding: 8px 0;
  }

  .thinking span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    opacity: 0.4;
    animation: pulse 1.2s infinite ease-in-out;
  }

  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 16px 28px 22px;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
  }

  form {
    display: flex;
    gap: 10px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 6px 6px 16px;
  }

  input[type="text"] {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--charcoal);
    padding: 10px 0;
  }

  input[type="text"]::placeholder {
    color: var(--charcoal);
    opacity: 0.4;
  }

  button {
    border: none;
    background: var(--ink);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 14px;
    padding: 0 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: #263a63; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .error {
    color: #A64B4B;
    font-size: 13.5px;
    margin-top: 8px;
  }

  @media (max-width: 480px) {
    header, main, footer { padding-left: 18px; padding-right: 18px; }
    .intro h1 { font-size: 22px; }
  }
</style>
</head>
<body>

  <header>
    <span class="brand">مستشارك</span>
    <span class="status"><span class="dot"></span>Ready to help</span>
  </header>

  <main id="main">
    <div class="intro" dir="rtl">
      <h1>اسأل عن التسجيل، المعدل التراكمي، متطلبات التخرج، أو أي شيء آخر موجود في الدليل الجامعي.</h1>
      <p>الإجابات مأخوذة مباشرة من الوثائق الرسمية للجامعة. إذا لم يكن الموضوع مغطى، سيتم توجيهك للتواصل مع مرشدك الأكاديمي بدلاً من إعطائك إجابة غير مؤكدة.</p>
    </div>
    <div id="messages"></div>
  </main>

  <footer>
    <form id="askForm">
      <input type="text" id="questionInput" placeholder="Type your question... / اكتب سؤالك" autocomplete="off" dir="auto" />
      <button type="submit" id="askButton">Ask</button>
    </form>
    <div class="error" id="errorBox" style="display:none;"></div>
  </footer>

  <script>
    const API_URL = "http://localhost:8000/api/ask";

    const form = document.getElementById("askForm");
    const input = document.getElementById("questionInput");
    const button = document.getElementById("askButton");
    const messages = document.getElementById("messages");
    const errorBox = document.getElementById("errorBox");
    const mainEl = document.getElementById("main");

    function scrollToBottom() {
      mainEl.scrollTop = mainEl.scrollHeight;
    }

    function addUserMessage(text) {
      const div = document.createElement("div");
      div.className = "message user";
      div.dir = "auto";
      div.textContent = text;
      messages.appendChild(div);
      scrollToBottom();
    }

    function addThinkingIndicator() {
      const div = document.createElement("div");
      div.className = "message assistant";
      div.id = "thinkingIndicator";
      div.innerHTML = `<span class="label">مستشارك</span><div class="thinking"><span></span><span></span><span></span></div>`;
      messages.appendChild(div);
      scrollToBottom();
    }

    function removeThinkingIndicator() {
      const el = document.getElementById("thinkingIndicator");
      if (el) el.remove();
    }

    function addAssistantMessage(answer, sources) {
      const div = document.createElement("div");
      div.className = "message assistant";

      const sourcesHtml = sources && sources.length
        ? `<details class="sources">
             <summary>Sources used (${sources.length})</summary>
             ${sources.map(s => `<div class="chunk">${escapeHtml(s)}</div>`).join("")}
           </details>`
        : "";

      div.innerHTML = `<span class="label">مستشارك</span>${escapeHtml(answer)}${sourcesHtml}`;
      div.dir = "auto";
      messages.appendChild(div);
      scrollToBottom();
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      errorBox.style.display = "none";
      addUserMessage(question);
      input.value = "";
      button.disabled = true;
      addThinkingIndicator();

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || "Something went wrong. Please try again.");
        }

        const data = await res.json();
        removeThinkingIndicator();
        addAssistantMessage(data.answer, data.sources);
      } catch (err) {
        removeThinkingIndicator();
        errorBox.textContent = err.message || "Could not reach the server. Is the backend running?";
        errorBox.style.display = "block";
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>

</body>
</html>
